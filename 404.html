<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Not found · SchemaCanvas</title>
    <!-- GitHub Pages serves this for unknown paths under the site (a real 404, so a missing asset is never answered with
         index.html). Built by Vite so %BASE_URL% becomes the base path. Static on purpose: no script. -->
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { max-width: 32rem; padding: 1.5rem; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 0.75rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found · 页面不存在</h1>
      <p>This address is not part of SchemaCanvas. 此地址不属于 SchemaCanvas。</p>
      <p><a href="%BASE_URL%">Open SchemaCanvas · 打开 SchemaCanvas</a></p>
    </main>
  </body>
</html>
