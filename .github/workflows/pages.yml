# Build SchemaCanvas and deploy it to GitHub Pages (https://xipuwang.github.io/schemacanvas/).
#
# Gates before anything is published:
#   1. unit + integration tests (Vitest)
#   2. npm run release:build: third-party notices, type-check, production build at base /schemacanvas/, and the publish gate
#      (scripts/check-dist.mjs: meta CSP pins the inline script, asset URLs under the base, 404 page, notices present, no source
#      maps, local paths, dev-only packages or secret-like tokens)
#   3. npm run release:verify: the build must be byte-identical to the committed release/MANIFEST.txt, so only a build that was
#      verified locally (browser suites, cross-browser, real databases, smoke test; see RELEASE-CHECKLIST.md) can go live
#
# Repository settings needed once: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Actions are pinned to full commit SHAs (tag in the comment).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a running deployment is never cancelled half-way
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        run: npx vitest run --maxWorkers=2
      - name: Release build and publish gate
        run: npm run release:build
      - name: Build matches the committed release manifest
        run: npm run release:verify
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
