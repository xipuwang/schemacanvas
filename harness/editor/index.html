<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor harness</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: var(--bench); color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
      .h-shell { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
      .h-bar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--rule); font-size: 13px; }
      .h-bar button { height: 28px; padding: 0 10px; border: 1px solid var(--rule-strong); border-radius: 3px; background: var(--panel-raised); color: var(--ink); font: inherit; }
      .h-bar button[aria-pressed='true'] { box-shadow: inset 0 -2px 0 var(--key); }
      .h-main { min-height: 0; position: relative; }
      .h-status { display: flex; gap: 16px; padding: 4px 10px; background: var(--panel); border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-2); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
